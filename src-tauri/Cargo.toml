[package]
name = "viewer"
version = "1.3.0"
description = "Client Windows natif pour serveur Emby"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (cargo#8519).
name = "viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
thiserror = "2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
base64 = "0.23"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Called from Rust only, no JS permission (ADR 0112).
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
schannel = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
